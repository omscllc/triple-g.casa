name: Triple G build and deploy

on:
  push:
    branches: ['develop']
  workflow_dispatch:
env:
  SCANNER_ARGS: |
    --exclude-files config/*

jobs:
  check-secrets:
    name: Checking for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Secret Scanner
        uses: secret-scanner/action@0.0.2
        with:
          detect-secret-additional-args: ${{ env.SCANNER_ARGS }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            echo "Changing to deploy path"
            cd ${{ vars.STG_DEPLOY_PATH }}
            echo "Setting proper permissions"
            chmod -R u+w web/sites/default
            echo "Pulling latest code"
            git pull
            echo "Backing up database"
            drush sql:dump > /var/www/db_backups/${{ vars.STG_BU_FILE_PREFIX }}.$(date +'%Y-%m-%d_%H:%M:%S').sql
            echo "Installing composer dependencies"
            composer install
            echo "Installing npm dependencies"
            npm install
            echo "Building assets"
            npm run build
            echo "Cleaning up node_modules"
            rm -rf node_modules
            echo "Clearing Drupal cache"
            drush cr
            echo "Importing config"
            drush cim -y
            echo "Updating database"
            drush updb -y
            echo "Final cache clear"
            drush cr
            echo "Site deployed to staging"
